    let currentLang = localStorage.getItem('app_language') || 'it';

        <option value="en" \${currentLang === 'en' ? 'selected' : ''}>🇬🇧 English</option>
      </select>`;
    }

    let vehicles = {}, currentVehicle = null, showAddForm = false, isMechanicMode = false, isClientMode = false;
    let showLoginScreen = true, searchQuery = '', showShareModal = false, shareModalTarga = null, realtimeUnsubscribe = null, showAppointmentForm = false;
    let showDashboard = false, showAdvancedSearch = false, filters = { date: '', type: '', mechanic: '', costMin: '', costMax: '' };
    let isOffline = !navigator.onLine;
    let deferredPrompt = null;

    // PWA Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallPrompt();
    });

    function showInstallPrompt() {
      if (!deferredPrompt || localStorage.getItem('pwa_dismissed')) return;

      const prompt = document.createElement('div');
      prompt.className = 'install-prompt';
      prompt.innerHTML = `
        <div>
          <strong>📱 \${t('pwa').installPrompt}</strong>
          ${isIOS() ? `<div style="font-size: 12px; margin-top: 4px;">${t('pwa').iosInstructions}</div>` : ''}
        </div>
        ${!isIOS() ? `<button onclick="installPWA()" style="margin-right: 8px;">${t('pwa').installButton}</button>` : ''}
        <button onclick="dismissInstallPrompt()">\${t('pwa').closeButton}</button>
      `;
      document.body.appendChild(prompt);
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    window.installPWA = async function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        showNotification(`✅ ${t('pwa').installed}`);
      }
      deferredPrompt = null;
      document.querySelector('.install-prompt')?.remove();
    };

    window.dismissInstallPrompt = function() {
      localStorage.setItem('pwa_dismissed', 'true');
      document.querySelector('.install-prompt')?.remove();
    };

    window.addEventListener('appinstalled', () => {
      showNotification(`✅ ${t('pwa').installed}`);
      deferredPrompt = null;
    });

    function showNotification(message, type = 'success') {
      const notification = document.createElement('div');
      notification.className = `notification ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => { notification.style.animation = 'slideIn 0.3s ease-out reverse'; setTimeout(() => notification.remove(), 300); }, 3000);
    }

    function showSyncIndicator(message = "🔄 Synchronisation...") {
      const existing = document.getElementById('syncIndicator');
      if (existing) existing.remove();

      const indicator = document.createElement('div');
      indicator.id = 'syncIndicator';
      indicator.className = 'fixed top-20 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 flex items-center gap-2';
      indicator.innerHTML = `
        <div class="loading" style="width: 16px; height: 16px; border-width: 2px;"></div>
        <span class="text-sm">\${message}</span>
      `;
      document.body.appendChild(indicator);

      setTimeout(() => indicator.remove(), 2000);
    }

    function showOfflineIndicator() {
      if (isOffline && isMechanicMode) {
        const indicator = document.createElement('div');
        indicator.className = 'offline-indicator';
        indicator.innerHTML = `⚠️ ${t('offlineMode')} - ${t('offlineMessage')}`;
        indicator.id = 'offlineIndicator';
        document.body.appendChild(indicator);
      } else {
        const indicator = document.getElementById('offlineIndicator');
        if (indicator) indicator.remove();
      }
    }

    function generateClientCode(targa) { return `${targa}-${new Date().getFullYear()}`; }

    function verifyClientCode(code) {
      const parts = code.toUpperCase().split('-');
      if (parts.length < 2) return null;
      const year = parts[parts.length - 1], targa = parts.slice(0, -1).join('-');
      const currentYear = new Date().getFullYear().toString(), lastYear = (new Date().getFullYear() - 1).toString();
      if ((year === currentYear || year === lastYear) && vehicles[targa]) return targa;
      return null;
    }

    function getClientLink(targa) {
      const code = vehicles[targa].clientCode || generateClientCode(targa);
      return `${window.location.origin}${window.location.pathname}?code=${encodeURIComponent(code)}`;
    }

    async function syncToFirestore(targa, vehicleData) {
      if (!USE_FIREBASE || !window.firebaseDB) return;
      try {
        const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js");
        await setDoc(doc(window.firebaseDB, 'vehicles', targa), vehicleData);
      } catch (error) {
        showNotification('⚠️ Sync error, but saved locally', 'error');
        isOffline = true;
        showOfflineIndicator();
      }
    }

    async function loadFromFirestore(targa, enableRealtime = false) {
      if (!USE_FIREBASE || !window.firebaseDB) return null;
      try {
        const { getDoc, doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js");

        if (enableRealtime) {
          if (realtimeUnsubscribe) realtimeUnsubscribe();

          realtimeUnsubscribe = onSnapshot(doc(window.firebaseDB, 'vehicles', targa), (docSnap) => {
            if (docSnap.exists()) {
              vehicles[targa] = docSnap.data();
              saveDataLocal();
              if (!showLoginScreen && currentVehicle === targa) {
                render();
                console.log("✅ Intervention mise à jour en temps réel!");
              }
            }
          }, (error) => {
            console.error("❌ Erreur listener temps réel:", error);
            isOffline = true;
            showOfflineIndicator();
          });

          const docSnap = await getDoc(doc(window.firebaseDB, 'vehicles', targa));
          return docSnap.exists() ? docSnap.data() : null;

        } else {
          const docSnap = await getDoc(doc(window.firebaseDB, 'vehicles', targa));
          return docSnap.exists() ? docSnap.data() : null;
        }
      } catch (error) {
        isOffline = true;
        showOfflineIndicator();
        return null;
      }
    }

    async function deleteFromFirestore(targa) {
      if (!USE_FIREBASE || !window.firebaseDB) return;
      try {
        const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js");
        await deleteDoc(doc(window.firebaseDB, 'vehicles', targa));
      } catch (error) {}
    }

    async function loadAllVehiclesFromFirestore() {
      if (!USE_FIREBASE || !window.firebaseDB) { loadDataLocal(); return; }
      try {
        const { collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js");
        if (realtimeUnsubscribe) realtimeUnsubscribe();
        realtimeUnsubscribe = onSnapshot(collection(window.firebaseDB, 'vehicles'), (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            const targa = change.doc.id;
            if (change.type === 'added' || change.type === 'modified') vehicles[targa] = change.doc.data();
            else if (change.type === 'removed') delete vehicles[targa];
          });
          saveDataLocal();
          if (!showLoginScreen) render();
        }, (error) => {
          isOffline = true;
          showOfflineIndicator();
          loadDataLocal();
        });
      } catch (error) { loadDataLocal(); }
    }

    function loadDataLocal() {
      try {
        const stored = localStorage.getItem('garage_vehicles');
        if (stored) vehicles = JSON.parse(stored);
      } catch (error) { vehicles = {}; }
    }

    function saveDataLocal() {
      try { localStorage.setItem('garage_vehicles', JSON.stringify(vehicles)); } catch (error) {}
    }

    function validatePlate(targa) {
      const pattern = /^[A-Z0-9]{2,3}[A-Z0-9]{2,3}[A-Z0-9]{2,3}\$/i;
      return pattern.test(targa);
    }

    function validateEmail(email) {
      const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+\$/;
      return pattern.test(email);
    }

    function validatePhone(phone) {
      const pattern = /^\+?[0-9\s\-()]{10,}\$/i;
      return pattern.test(phone);
    }

    function getReminders(targa) {
      const vehicle = vehicles[targa];
      const reminders = [];
      const today = new Date();

      vehicle.interventi?.forEach(inter => {
        if (inter.tipo === 'Tagliando' && inter.chilometraggio) {
          const nextKm = parseInt(inter.chilometraggio) + 15000;
          const currentKm = parseInt(vehicle.chilometraggio || 0);
          if (currentKm >= nextKm - 1000) {
            reminders.push({ type: 'oilChange', message: `${t('reminderOilChange')} (${nextKm} km)`, urgency: 'high' });
          }
        }
      });

      return reminders;
    }

    async function login() {
      const code = document.getElementById('loginCode').value.trim();
      if (!code) return showNotification(`❌ ${t('invalidCode')}`, 'error');

      if (code === MECHANIC_PIN) {
        isMechanicMode = true;
        isClientMode = false;
        showLoginScreen = false;
        currentVehicle = null;
        showNotification(`✅ ${t('mechanicAccess')}`);
        await loadAllVehiclesFromFirestore();
        render();
        return;
      }

      const parts = code.toUpperCase().split('-');
      if (parts.length >= 2) {
        const year = parts[parts.length - 1];
        const targa = parts.slice(0, -1).join('-');

        const vehicleData = await loadFromFirestore(targa, true);

        if (vehicleData) {
          vehicles[targa] = vehicleData;
          saveDataLocal();

          const currentYear = new Date().getFullYear().toString();
          const lastYear = (new Date().getFullYear() - 1).toString();

          if (year === currentYear || year === lastYear) {
            isClientMode = true;
            isMechanicMode = false;
            showLoginScreen = false;
            currentVehicle = targa;
            showNotification(`✅ ${t('welcome')} - ${t('realtimeActive')}`);
            render();
            return;
          }
        }
      }

      showNotification(`❌ ${t('invalidCode')}`, 'error');
    }

    function logout() {
      if (confirm(t('logoutConfirm'))) {
        if (realtimeUnsubscribe) { realtimeUnsubscribe(); realtimeUnsubscribe = null; }
        isMechanicMode = false; isClientMode = false; showLoginScreen = true; currentVehicle = null;
        showAddForm = false; searchQuery = ''; showAppointmentForm = false; showDashboard = false; showAdvancedSearch = false;
        showNotification(`👋 ${t('disconnected')}`);
        render();
      }

      const otherModelInput = document.getElementById('otherModelInput');

        modelSelect.disabled = false;

          const option = document.createElement('option');

          modelSelect.appendChild(option);
        });

        const otherOption = document.createElement('option');
        otherOption.value = 'other';

        modelSelect.disabled = true;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = t('selectBrandFirst');
        placeholder.disabled = true;
        placeholder.selected = true;
        modelSelect.appendChild(placeholder);
      }

      const modelSelect = document.getElementById('newVehicleModello');
      const otherModelInput = document.getElementById('otherModelInput');

      if (modelSelect.value === 'other') {
        otherModelInput.style.display = 'block';
        otherModelInput.value = '';
      } else {
        otherModelInput.style.display = 'none';
      }
